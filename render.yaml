# Render Blueprint — deploys the backend as a free web service.
#
# By default this file leaves DATABASE_URL and REDIS_URL as "sync: false"
# (Render prompts you for them on first deploy). Two supported paths:
#
#   A) Card-free  — Neon Postgres + Upstash Redis (recommended, see
#      docs/CLOUD_DEPLOY.md § "Card-free path")
#   B) Card-required — uncomment the `databases:` and `- type: redis`
#      blocks below to have Render provision managed Postgres + Redis
#      alongside the web service (both need a payment method on file).
#
# Object storage is always via env vars. Card-free option is Supabase
# Storage (also S3-compatible); the card-required option is Cloudflare R2.
#
# One-time setup:
#   1. Sign into Render with your GitHub.
#   2. Dashboard → New → Blueprint → pick your fork → branch.
#   3. Render reads this file and prompts for the sync:false variables.
#   4. Wait for the API to go green; note its public URL.

services:
  - type: web
    name: idcard-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO

      # Paste your Neon (or Render/Supabase) Postgres URL here on first deploy.
      # Format: postgresql+asyncpg://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Optional — leave blank to disable the Redis-backed rate limiter
      # (middleware fails open). Use rediss://... for Upstash TLS.
      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true                # Render generates a 64-char secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: 604800
      - key: BCRYPT_ROUNDS
        value: 12

      # Object storage — Supabase Storage (card-free) or Cloudflare R2. Both
      # are S3-compatible. See CLOUD_DEPLOY.md for exact field values.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_PHOTOS
        sync: false
      - key: S3_BUCKET_IDCARDS
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_USE_PATH_STYLE
        value: "true"
      - key: PRESIGN_TTL_SECONDS
        value: 300
      - key: MAX_PHOTO_BYTES
        value: 5242880

      # CORS — comma-separated list. Add your Vercel URL(s) here after the
      # dashboard deploys, e.g. https://idcard.vercel.app
      - key: CORS_ORIGINS
        sync: false

# ---- Managed Postgres + Redis (requires a payment method on Render) --------
# Uncomment to have Render provision these next to the API instead of using
# Neon/Upstash. Remove or comment out the sync:false lines for DATABASE_URL
# and REDIS_URL above, and re-wire them with fromDatabase / fromService.
#
# databases:
#   - name: idcard-postgres
#     plan: free
#     region: oregon
#     databaseName: idcard
#     postgresMajorVersion: 15
#     ipAllowList: []
#
# services:
#   - type: redis
#     name: idcard-redis
#     plan: free
#     region: oregon
#     maxmemoryPolicy: allkeys-lru
#     ipAllowList: []
